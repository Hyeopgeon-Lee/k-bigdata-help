<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0b1739"><title>내 요청 | BigData Help</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css?v=20261005-portal">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="학과 요청 문의 홈">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>빅데이터소프트웨어공학과</strong><small>학과 요청 · 문의</small></span>
      </a>
      <nav class="desktop-nav" aria-label="주요 메뉴">
        <a href="index.html">홈</a>
        <a href="request.html">요청 등록</a>
        <a class="active" aria-current="page" href="my.html">내 요청</a>
        <a class="portal-home" href="https://portal.k-bigdata.kr/">통합 포털 ↗</a>
      </nav>
      <a class="mobile-portal-link" href="https://portal.k-bigdata.kr/">포털 ↗</a>
    </div>
  </header>
  <main class="page page--form">
    <div class="page-title"><p class="eyebrow">나의 티켓</p><h1>내 요청 조회</h1><p>등록할 때 입력한 학번과 PIN을 입력해주세요.</p></div>
    <form id="lookup-form" class="form-card form-card--compact">
      <label>학번<input name="studentId" type="text" required maxlength="20" inputmode="numeric" autocomplete="username" placeholder="25110001"></label>
      <label>PIN<input name="pin" type="password" required maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="current-password" placeholder="••••"></label>
      <p id="lookup-feedback" class="form-feedback" role="status"></p>
      <button class="button button--primary" type="submit">조회하기</button>
    </form>
    <section id="my-results" class="ticket-list results-list" aria-live="polite"></section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴"><a href="index.html"><span>⌂</span>홈</a><a href="request.html"><span>＋</span>요청 등록</a><a class="active" href="my.html" aria-current="page"><span>◎</span>내 요청</a></nav>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/my.js"></script>

</html>
