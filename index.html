<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0b1739">
  <meta name="description" content="빅데이터소프트웨어공학과 요청·문의 Help Desk">
  <title>BigData Help</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20261005-portal2">
  <style>
    /* Portal header typography and navigation, scoped to the Help home. */
    .site-header{height:76px;border-bottom:1px solid rgba(210,220,238,.8);background:rgba(255,255,255,.88);backdrop-filter:blur(16px);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.6}
    .header-inner{width:min(calc(100% - 40px),1240px);max-width:none;gap:16px}
    .brand span{font-size:inherit;font-weight:400;letter-spacing:normal;color:inherit}
    .brand .brand-copy{line-height:1.25}
    .brand-copy strong{font-weight:700}
    .brand-copy small{font-weight:400;letter-spacing:normal}
    .desktop-nav{gap:18px}
    .desktop-nav a{position:relative;min-height:0;padding:8px 0;border-radius:0;font-weight:650;line-height:1.6}
    .desktop-nav a:hover,.desktop-nav a.active{color:var(--navy);background:transparent}
    .desktop-nav a::after{content:"";position:absolute;right:0;bottom:1px;left:0;height:2px;background:var(--navy);transform:scaleX(0);transition:transform .22s ease}
    .desktop-nav a:hover::after,.desktop-nav a.active::after{transform:scaleX(1)}
    .desktop-nav .portal-home{margin-left:0;border:0;background:transparent;color:#3d4961}
    .desktop-nav a.admin-login-link{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:8px 12px;border:1px solid #cedced;border-radius:9px;color:var(--navy);background:#fff;white-space:nowrap}
    .desktop-nav a.admin-login-link::after{display:none}
    .desktop-nav a.admin-login-link:hover,.desktop-nav a.admin-login-link:focus-visible{color:var(--navy);background:#edf4fb;border-color:#99b6d8}
    .mobile-header-actions{display:none;align-items:center;gap:6px;flex:0 0 auto}
    .mobile-admin-login{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:7px 10px;border:1px solid #cedced;border-radius:9px;color:var(--navy);font-size:12px;font-weight:750;white-space:nowrap}
    .mobile-admin-login:hover,.mobile-admin-login:focus-visible{background:#edf4fb;border-color:#99b6d8}
    .mobile-header-actions .mobile-portal-link{display:inline-flex;align-items:center;min-height:40px;padding:6px 2px;white-space:nowrap}
    @media(max-width:759px){
      .mobile-header-actions{display:flex}
      .header-inner{gap:8px}
      .brand{min-width:0;flex:1 1 auto}
      .brand-copy{min-width:0}
      .brand-copy strong,.brand-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    }
    @media(max-width:900px){
      .site-header{height:60px}
    }
    @media(max-width:767px){
      .header-inner{width:calc(100% - 36px)}
      .brand-mark{width:36px;height:36px;flex-basis:36px;transform:scale(.9)}
      .brand-copy strong{font-size:13px}
      .brand-copy small{font-size:11px}
    }
    @media(max-width:389px){
      .header-inner{width:calc(100% - 32px)}
    }
    @media(max-width:380px){
      .brand-mark{width:34px;height:34px;flex-basis:34px}
      .brand{gap:9px}
      .brand-copy strong{font-size:12px}
      .mobile-header-actions{gap:4px}
      .mobile-admin-login{padding:7px 7px;font-size:11px}
      .mobile-header-actions .mobile-portal-link{font-size:11px;padding:6px 0}
    }
    /* Match the portal's desktop container on this page only. */
    @media (min-width:1024px){
      .header-inner,.page--home{width:min(calc(100% - 40px),1240px)}
      .page--home{max-width:none;padding-left:0;padding-right:0}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="학과 요청 문의 홈">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>빅데이터소프트웨어공학과</strong><small>학과 요청 · 문의</small></span>
      </a>
      <nav class="desktop-nav" aria-label="주요 메뉴">
        <a class="active" aria-current="page" href="index.html">홈</a>
        <a href="request.html">요청 등록</a>
        <a href="my.html">내 요청</a>
        <a class="portal-home" href="https://portal.k-bigdata.kr/">통합 포털 ↗</a>
        <a class="admin-login-link" href="admin.html" aria-label="관리자 로그인"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>관리자 로그인</a>
      </nav>
      <div class="mobile-header-actions">
        <a class="mobile-admin-login" href="admin.html" aria-label="관리자 로그인">관리자</a>
        <a class="mobile-portal-link" href="https://portal.k-bigdata.kr/">포털 ↗</a>
      </div>
    </div>
  </header>
  <main class="page page--home">
    <section class="hero-card">
      <p class="eyebrow">한국폴리텍대학 서울강서캠퍼스</p>
      <h1>학과에 도움이 필요하신가요?</h1>
      <p>불편 사항과 문의를 남기면 처리 상태와 답변을 한곳에서 확인할 수 있습니다.</p>
      <a class="button button--primary button--large" href="request.html">+ 요청 등록하기</a>
    </section>
    <div id="home-notice" class="notice" role="status" hidden></div>
    <section aria-labelledby="status-title">
      <div class="section-heading"><h2 id="status-title">현재 요청 현황</h2></div>
      <div id="status-counts" class="status-grid" aria-live="polite"><div class="loading">불러오는 중...</div></div>
    </section>
    <section aria-labelledby="recent-title">
      <div class="section-heading"><h2 id="recent-title">최근 요청</h2><span>개인정보는 표시되지 않습니다</span></div>
      <div id="recent-list" class="ticket-list" aria-live="polite"><div class="loading">불러오는 중...</div></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <a class="active" href="index.html" aria-current="page"><span aria-hidden="true">⌂</span>홈</a>
    <a href="request.html"><span aria-hidden="true">＋</span>요청 등록</a>
    <a href="my.html"><span aria-hidden="true">◎</span>내 요청</a>
  </nav>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/index.js"></script>
</body>
</html>
