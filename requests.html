<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0b1739">

  <link rel="stylesheet" href="css/style.css?v=20261022-listing-1">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="학과 요청 문의 홈">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>빅데이터소프트웨어공학과</strong><small>학과 요청 · 문의</small></span>
      </a>
      <nav class="desktop-nav" aria-label="주요 메뉴">
        <a href="index.html">홈</a>
        <a href="request.html">요청 등록</a>
        <a href="my.html">내 요청</a>
        <a class="active" aria-current="page" href="requests.html">전체 요청</a>
        <a class="portal-home" href="https://portal.k-bigdata.kr/">통합 포털 ↗</a>
        <a class="admin-login-link" href="admin.html" aria-label="관리자 로그인"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>관리자 로그인</a>
      </nav>
      <div class="mobile-header-actions">
        <a class="mobile-admin-login" href="admin.html" aria-label="관리자 로그인">관리자</a>
        <a class="mobile-portal-link" href="https://portal.k-bigdata.kr/">포털 ↗</a>
      </div>
    </div>
  </header>
<main class="page page--all-requests">
    <div class="page-title">
      <p class="eyebrow">Help Desk</p>
      <h1>전체 요청</h1>
      <p>접수된 요청을 상태별로 확인할 수 있습니다. 삭제된 요청과 개인정보는 공개하지 않습니다.</p>
    </div>
    <form class="public-filters" id="public-filters">
      <label for="public-status">처리 상태
        <select id="public-status" name="status">
          <option value="ALL">전체 상태</option>
          <option value="RECEIVED">접수</option>
          <option value="CHECKING">확인중</option>
          <option value="PROCESSING">처리중</option>
          <option value="COMPLETED">완료</option>
        </select>
      </label>
      <label for="public-sort">정렬
        <select id="public-sort" name="sort">
          <option value="newest">최신 등록순</option>
          <option value="oldest">오래된 등록순</option>
        </select>
      </label>
    </form>
    <div class="results-heading">
      <strong id="public-count" aria-live="polite">요청 목록을 불러오는 중...</strong>
      <a href="index.html">← 홈으로</a>
    </div>
    <p id="public-notice" class="notice" role="status" hidden></p>
    <section id="public-requests" class="ticket-list" aria-live="polite"><div class="loading">불러오는 중...</div></section>
    <nav id="public-pagination" class="pagination" aria-label="전체 요청 페이지 이동"></nav>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <a href="index.html"><span aria-hidden="true">⌂</span>홈</a>
    <a href="request.html"><span aria-hidden="true">＋</span>요청 등록</a>
    <a href="my.html"><span aria-hidden="true">◎</span>내 요청</a>
  </nav>
  <script src="js/config.js"></script><script src="js/api.js?v=20261022-listing-1"></script><script src="js/requests.js?v=20261022-listing-1"></script>
</body>
</html>
