<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1739"><title>관리자 | BigData Help</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css?v=20261022-listing-1">
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="학과 요청 문의 홈">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>빅데이터소프트웨어공학과</strong><small>요청 관리</small></span>
      </a>
      <nav class="desktop-nav" aria-label="주요 메뉴">
        <a href="index.html">사용자 화면</a>
        <a class="portal-home" href="https://portal.k-bigdata.kr/">통합 포털 ↗</a>
      </nav>
      <a class="mobile-portal-link" href="https://portal.k-bigdata.kr/">포털 ↗</a>
    </div>
  </header>
  <main class="page page--admin">
    <div class="page-title"><p class="eyebrow">Help Desk</p><h1>요청 관리</h1><p>접수된 요청을 확인하고 상태와 답변을 관리합니다.</p></div>
    <form id="admin-auth" class="form-card form-card--compact admin-auth" autocomplete="on">
      <label for="admin-username">관리자 아이디
        <input id="admin-username" name="adminUsername" type="text" required autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="아이디">
      </label>
      <label for="admin-password">비밀번호
        <input id="admin-password" name="adminPassword" type="password" required autocomplete="current-password" placeholder="비밀번호">
      </label>
      <button class="button button--primary" type="submit">로그인</button>
    </form>
    <p id="admin-notice" class="notice" role="status"></p>
    <div id="admin-workspace" hidden>
    <div id="admin-summary" class="admin-summary"></div>
    <div class="toolbar toolbar--filters">
      <label for="deleted-filter">조회 범위
        <select id="deleted-filter"><option value="active">활성 요청</option><option value="all">전체 (삭제 포함)</option><option value="deleted">삭제된 요청만</option></select>
      </label>
      <label for="request-kind-filter">신고 구분
        <select id="request-kind-filter"><option value="ALL">전체 요청</option><option value="practical">실기문제 신고</option><option value="interview">기술면접 신고</option><option value="coding">기초학습 신고</option><option value="other">일반 요청</option></select>
      </label>
      <label for="status-filter">처리 상태
        <select id="status-filter"><option value="ALL">전체 상태</option><option value="RECEIVED">접수</option><option value="CHECKING">확인중</option><option value="PROCESSING">처리중</option><option value="COMPLETED">완료</option></select>
      </label>
      <label for="request-search">요청 검색
        <input id="request-search" type="search" placeholder="요청번호·제목·내용·요청자">
      </label>
      <label for="date-from">시작일
        <input id="date-from" type="date">
      </label>
      <label for="date-to">종료일
        <input id="date-to" type="date">
      </label>
      <label for="sort-order">정렬
        <select id="sort-order"><option value="newest">최신 등록순</option><option value="oldest">오래된 등록순</option></select>
      </label>
      <label for="page-size">페이지 크기
        <select id="page-size"><option value="20">20건씩</option><option value="50">50건씩</option></select>
      </label>
    </div>
    <div class="results-heading"><strong id="admin-result-count" aria-live="polite"></strong><span>위 조건에 해당하는 요청만 집계합니다.</span></div>
    <section id="admin-list" class="admin-list" aria-live="polite"></section>
    <nav id="admin-pagination" class="pagination" aria-label="관리자 요청 페이지 이동"></nav>
    </div>
  </main>
  <script src="js/config.js?v=20261008-magic1"></script><script src="js/api.js?v=20261022-admin-login-1"></script><script src="js/admin.js?v=20261022-listing-1"></script>
</body>
</html>
